scenario: fastest-delivery-routes
answers:
- id: correct
  kind: correct
  verdict: pass
  text: 'Intersections and addresses are nodes and roads are weighted edges. Set the depot''s time to 0 and everything else to infinity. Use a min-priority queue: pop the node with the smallest time, and for each road out of it, if its time plus the road''s time beats the neighbor''s current time, update the neighbor and push it. Once a node is popped its time is final, because all road times are non-negative, so any other route to it would be at least as long. With a binary heap that''s O((V + E) log V).'
  labels:
    weighted-graph: hit
    init-distances: hit
    min-queue: hit
    relax: hit
    finalized-why: hit
    cost: hit
