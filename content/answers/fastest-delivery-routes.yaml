  kind: missing_key_idea
  verdict: fail
  text: Weighted graph, depot at 0, everything else infinity. Put the depot in a priority queue keyed by time, and always take the one with the lowest time next. For each road out of it, if the neighbor doesn't have a time yet, give it this node's time plus the road's time and push it. Once a place has a time it's final, since road times are never negative. O((V + E) log V).
  labels:
