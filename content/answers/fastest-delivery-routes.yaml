- id: alternative
  kind: alternative
  verdict: pass
  text: Set the depot to 0 and every other node to infinity. Then go over every road and, if going through it makes its end faster, update it. Repeat that full pass over all roads V - 1 times. After k passes, every place whose fastest route uses at most k roads is correct, and no fastest route needs more than V - 1 roads. It's O(V x E), slower, but it would even handle negative times.
  labels:
    weighted-graph: hit
    init-distances: hit
    min-queue: miss
    relax: hit
    finalized-why: miss
    cost: miss
  notes: Repeated passes over all edges. Correct, slower.
