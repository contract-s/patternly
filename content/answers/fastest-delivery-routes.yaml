- id: alternative
  kind: alternative
  verdict: pass
  text: 'Travel times are whole minutes, so instead of a heap I''d use buckets indexed by time: bucket t holds the places whose best known time is t. Start with the depot in bucket 0 and every other place at infinity. Walk the buckets in increasing order of t. For each place in the current bucket (skipping it if its time has since gone down), check each road out of it, and if that gives a neighbor a faster time, move the neighbor into the bucket for its new time. Since no road takes negative time, a place''s time can''t drop after its bucket has been reached. That''s O(V + E + T), where T is the largest travel time.'
  labels:
    weighted-graph: hit
    init-distances: hit
    min-queue: hit
    relax: hit
    finalized-why: hit
    cost: miss
  notes: Bucket queue instead of a heap, which works because times are small whole numbers. Valid and fast; the cost bound differs from the heap version.
