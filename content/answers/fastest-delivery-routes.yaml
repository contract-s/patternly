- id: missing-key-idea
  kind: missing_key_idea
  verdict: fail
  text: Weighted graph, depot at 0, everything else infinity. Put the depot in a priority queue keyed by time, and always take the one with the lowest time next. For each road out of it, if going through it is faster, update the neighbor and push it. When the queue is empty you have all the times. O((V + E) log V).
  labels:
