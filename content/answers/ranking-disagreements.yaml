scenario: ranking-disagreements
answers:
- id: correct
  kind: correct
  verdict: pass
  text: 'Relabel each film with its rank from critic A and list them in critic B''s order. Now a disagreement is a pair where a bigger number comes before a smaller one. Count those recursively: split the list in half, count inside each half, and return each half sorted. Then merge the halves; whenever the next smallest comes from the right half, every item still in the left half is bigger and was earlier, so add how many are left there. Merging is linear, so the whole thing is O(n log n).'
  labels:
    reduce: hit
    divide: hit
    count-while-merging: hit
    sorted-output: hit
    cost: hit
