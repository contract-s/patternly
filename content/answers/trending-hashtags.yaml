scenario: trending-hashtags
answers:
- id: correct
  kind: correct
  verdict: pass
  text: First count every hashtag with a hash map. Then go through the counts keeping a min-heap of at most 10 entries. Until it has 10, just push. After that, if a hashtag's count is bigger than the top of the heap, pop the top and push the new one. The heap keeps the smallest of my current top 10 on top because that's the one I compare against and kick out. At the end the heap has the top 10. That's O(n log 10) instead of O(n log n) for sorting.
  labels:
    count: hit
    size-k: hit
    replace-smallest: hit
    why-min: hit
    cost: hit
