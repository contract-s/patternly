- id: alternative
  kind: alternative
  verdict: pass
  text: Make the prerequisite graph and do a recursive walk from each course, marking courses as in progress or done. Before finishing a course, walk all the courses it needs first. Add a course to the plan when it's done, so a course always comes after everything it needs. If the walk ever reaches a course that's still in progress, the prerequisites loop and there's no plan. O(V + E).
