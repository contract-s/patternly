scenario: course-prerequisite-plan
answers:
- id: correct
  kind: correct
  verdict: pass
  text: Make a directed graph with an edge from each prerequisite to the course that needs it. Count each course's prerequisites. Put every course with a count of 0 into a queue. Repeatedly take one out, add it to the plan, and subtract 1 from every course that needed it, queueing any that drop to 0. If the plan ends up with every course, that's a valid order; if some never got in, they're in a prerequisite loop and there's no plan. Each course and edge is handled once, O(V + E).
  labels:
    directed-graph: hit
    indegree: hit
    start-zero: hit
    remove-and-update: hit
    cycle-detect: hit
    cost: hit
- id: partial
  kind: partial
  verdict: fail
  text: Start with the courses that have no prerequisites and take those first. Then take courses whose prerequisites you've finished, and keep going until you've taken everything.
