  kind: missing_key_idea
  verdict: fail
  text: Build a graph from prerequisites to courses and count prerequisites per course. Queue every course with 0. Pop one, add it to the plan, and decrement the count for each course that depends on it, queueing the ones that reach 0. When the queue is empty, return the plan. O(V + E).
  labels:
    directed-graph: hit
    indegree: hit
    start-zero: hit
    remove-and-update: hit
