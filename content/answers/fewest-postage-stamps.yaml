scenario: fewest-postage-stamps
answers:
- id: correct
  kind: correct
  verdict: pass
  text: Greedy fails, like 14 = 7 + 7, so I'd try every possible last stamp. Let best[a] be the fewest stamps that make exactly a cents. best[0] = 0, and everything else starts as infinity meaning impossible. For a from 1 up to A, best[a] = 1 + min of best[a - s] over each stamp s <= a. Small amounts get reused a lot, which is why storing them helps. Answer is best[A], or impossible if it's still infinity. That's O(A times the number of stamp types).
  labels:
    subproblem: hit
    recurrence: hit
    base-cases: hit
    order: hit
    reuse-subproblems: hit
    cost: hit
