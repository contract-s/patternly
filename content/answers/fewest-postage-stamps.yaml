- id: alternative
  kind: alternative
  verdict: pass
  text: Treat every amount from 0 to A as a node, with an edge from a to a + s for each stamp s. Start a queue at 0 and explore level by level, marking amounts as seen. Level k is every amount you can make with exactly k stamps, so the first time you reach A, k is the fewest stamps. If A is never reached, it's impossible. Each amount is visited once with one edge per stamp, so O(A x number of stamps).
