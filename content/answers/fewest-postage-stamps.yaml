  text: Define best[a] as the fewest stamps for a cents. Then best[a] = 1 + min over stamps s <= a of best[a - s]. Fill from 1 up to A and return best[A]. Storing the answers matters because the same smaller amounts come up over and over, so plain recursion would redo them. That's A times the number of stamps.
