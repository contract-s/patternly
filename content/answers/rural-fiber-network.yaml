- id: alternative
  kind: alternative
  verdict: pass
  text: Start from any one town. Keep a priority queue of cables leaving the connected set, keyed by price. Repeatedly take the cheapest cable that reaches a town not yet connected, lay it, and add that town's cables to the queue. Cables to towns already connected get skipped. When all n towns are in, you've laid n - 1 cables and it's the cheapest network, since every step takes the cheapest way to grow the connected set. O(E log V).
  labels:
    spanning-framing: hit
    sort-edges: miss
    greedy-join: hit
    union-find: miss
    stop-count: hit
    cost: miss
  notes: Grows one connected tree from a start town. Valid, different from sorting all edges.
