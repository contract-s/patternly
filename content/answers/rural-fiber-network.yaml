scenario: rural-fiber-network
answers:
- id: correct
  kind: correct
  verdict: pass
  text: 'We want every town connected with no loops, because any loop has a cable we could drop. Sort all the possible cables from cheapest to most expensive. Put every town in its own group using union-find. Go through the cables in order: if the two towns are in different groups, lay the cable and merge the groups; if they''re already in the same group, skip it because it would make a loop. Stop once you''ve laid n - 1 cables. Sorting dominates, so it''s O(E log E).'
  labels:
