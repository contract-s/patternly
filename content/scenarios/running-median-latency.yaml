id: running-median-latency
pattern: heap
title: Live median response time
prompt: |
  A monitoring dashboard receives response times one at a time, all day, and must always show the median of every response time seen so far. Re-sorting the whole history after each new value is too slow.
rubric:
- id: two-halves
  idea: Splits the values into a lower half and an upper half.
- id: two-heaps
  idea: Keeps the lower half in a max-heap and the upper half in a min-heap, so the middle values are at the tops.
- id: insert-side
  idea: Puts each new value in the lower half if it's at most the lower half's top, otherwise in the upper half.
- id: rebalance
  idea: Moves a top value across whenever the halves differ in size by more than one.
- id: read-median
  idea: Reads the median from the top of the bigger half, or averages the two tops when the sizes are equal.
- id: cost
  idea: O(log n) per new value and O(1) to read the median.
hints:
- The median splits the values into a smaller half and a larger half. Which values in each half do you actually need to look at to find it?
- You only need the biggest value in the lower half and the smallest value in the upper half. Keep the two halves in structures that give you those instantly.
- Keep the lower half in a structure with its largest on top and the upper half in one with its smallest on top. Put each new value in the correct half, then move a top across if one half gets more than one bigger than the other. Where do you read the median from when the sizes are equal?
reference_solution: |
  Keep a max-heap low and a min-heap high. Insert into low if the value <= low's top (or low is empty), else into high. If one heap has two more items than the other, pop its top and push it into the other. The median is the top of the larger heap, or the average of both tops when they're equal in size.
time_complexity: O(log n) per insert
space_complexity: O(n)
