id: first-broken-build
pattern: binary-search
title: Finding the first broken nightly build
prompt: |
  Your team kept 10,000 nightly builds, numbered in order. At some point a bug slipped in, and every build after that one is broken too. Running the test suite on a build takes 20 minutes. Find the first broken build. Testing them one by one would take weeks, and the team needs an answer today.
rubric:
- id: sorted-property
  idea: Notices builds go good, good, ..., broken, broken, so the answer to 'is it broken?' flips exactly once.
- id: test-middle
  idea: Tests the build in the middle of the remaining range.
- id: discard-half
  idea: If the middle build is broken, the first broken one is it or earlier; if it's good, the answer is later. Throws away the other half.
- id: boundary
  idea: Narrows until one build is left (low meets high) and correctly lands on the first broken one, not just any broken one.
- id: log-cost
  idea: Needs about log2(10,000), around 14 tests, instead of up to 10,000.
hints:
- 'Look at the pattern of results across the builds: good, good, ..., broken, broken. What does testing one build in the middle tell you about all the others?'
- If a build is broken, every later build is broken too. So one test lets you throw away about half the remaining builds. Which half?
- Keep a low and high bound. If the middle build is broken, the first broken build is the middle one or earlier, so keep it in range. If it's good, the answer is strictly after it. How many tests does it take to shrink 10,000 builds to one?
reference_solution: |
  Set low = 1 and high = 10,000. While low < high, test mid = (low + high) / 2. If mid is broken, set high = mid, since the first broken build is mid or earlier. Otherwise set low = mid + 1. When low equals high, that build is the first broken one. Each test halves the range, so about 14 tests.
time_complexity: O(log n) tests
space_complexity: O(1)
