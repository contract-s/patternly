id: in-place-leaderboard-sort
pattern: quicksort
title: Sorting scores on a memory-tight device
prompt: |
  A handheld game console has to sort several million high-score entries by score. It has almost no spare memory, so the sort must happen inside the existing array, and it should be fast on average. The scores often arrive already nearly sorted.
rubric:
- id: pivot
  idea: Picks a pivot value from the range.
- id: partition
  idea: Rearranges the range so values smaller than the pivot are on its left and larger ones on its right, in place.
- id: pivot-final
  idea: Notes the pivot is now in its final sorted position.
- id: recurse
  idea: Sorts the left part and the right part the same way.
- id: random-pivot-why
  idea: Explains that always picking the first or last item is O(n^2) on nearly sorted input, and a random pivot avoids that.
- id: cost
  idea: States O(n log n) on average and that it sorts in place, using only recursion-stack memory (O(log n) if the smaller side is handled first).
hints:
- Pick one score. Can you rearrange the array, in place, so that score ends up exactly where it belongs in the sorted order?
- Put every score smaller than your chosen one on its left and every larger score on its right. Now that score is in its final spot, and the left and right parts are just smaller versions of the same problem.
- How you pick that score matters. If you always pick the first or last entry and the data is already nearly sorted, one side is almost empty every time. What does that cost, and how would picking at random help? To keep memory small, which side should you handle first?
reference_solution: |
  Pick a random index in the range and swap it to the end as the pivot. Walk the range keeping a boundary: each value smaller than the pivot is swapped to just after the boundary. Swap the pivot into the slot after the boundary, where it now belongs. Recurse on the left and right parts. Recursing on the smaller part first and looping on the larger keeps the stack at O(log n).
time_complexity: O(n log n) average, O(n^2) worst
space_complexity: O(log n)
