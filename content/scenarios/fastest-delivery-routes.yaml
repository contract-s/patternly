id: fastest-delivery-routes
pattern: dijkstra
title: Fastest routes from the depot
prompt: |
  A delivery company has a road map where each road segment has a travel time in whole minutes (never negative). Every morning it needs the fastest travel time from the depot to every address on the map. The map has about 300,000 intersections, and the times have to be ready within a few seconds.
rubric:
- id: weighted-graph
  idea: Models intersections and addresses as nodes and road segments as weighted edges.
- id: init-distances
  idea: Sets the depot's time to 0 and every other node's to infinity.
- id: min-queue
  idea: Uses a min-priority queue to always take the unfinished node with the smallest known time next.
- id: relax
  idea: For the node taken, checks each road out of it and lowers a neighbor's time if going through this node is faster.
- id: finalized-why
  idea: Explains a node's time is final once it's taken from the queue, because times are never negative, so no later path can be shorter.
- id: cost
  idea: O((V + E) log V) with a binary heap.
hints:
- Out of all the places you haven't settled yet, which one can you be sure you already know the fastest time for?
- The closest unsettled place is safe to settle, because every other route to it would go through somewhere at least as far away, and travel times are never negative. Settle it, then see what it improves.
- Start the depot at 0 and everything else at infinity. Repeatedly take the unsettled place with the smallest time (a structure that always hands you the minimum helps), and for each road out of it, lower the neighbor's time if going through here is faster. Why would negative road times break this?
reference_solution: |
  Set dist[depot] = 0, everything else infinity, and push the depot into a min-priority queue. Repeatedly pop the node with the smallest dist (skip it if it's an outdated entry). For each road to a neighbor, if dist[node] + time < dist[neighbor], update dist[neighbor] and push it. When the queue is empty, dist holds the fastest times.
time_complexity: O((V + E) log V)
space_complexity: O(V)
