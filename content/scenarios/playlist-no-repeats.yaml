id: playlist-no-repeats
pattern: sliding-window
title: Longest run of songs with no repeats
prompt: |
  A music app wants to show each listener their longest run of consecutive plays where no song played twice. Given the ordered list of song IDs a listener played this year, find the length of that longest run.
rubric:
- id: contiguous-range
  idea: Treats the run as a range between a left and a right position.
- id: seen-lookup
  idea: Keeps a hash map (or set) of songs in the current range, or each song's last position, for O(1) duplicate checks.
- id: shrink-on-repeat
  idea: When the new song is already in the range, moves the left end past that song's earlier play.
- id: track-best
  idea: Updates the best length after each new song is added.
- id: linear-time
  idea: Each play is added and removed at most once, giving O(n) time.
hints:
- You want the longest unbroken run of plays. When a run gets ruined by a repeat, do you really need to start over from scratch?
- Keep a run with a left and right end, plus a way to instantly check whether a song is already inside it.
- When the next song is already in the run, slide the left end just past that song's earlier play. Remembering the last position each song was played lets you jump straight there. Update the best length after every song.
reference_solution: |
  Keep a map from song ID to the last index it was played, and left = 0. For each right: if the song at right was last played at an index >= left, move left to that index + 1. Record the song's index as right and update best with right - left + 1.
time_complexity: O(n)
space_complexity: O(k) for k distinct songs
