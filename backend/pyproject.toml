[project]
name = "patternly"
version = "0.1.0"
description = "Explain-first tutor for algorithm patterns"

authors = [
    { name = "Sai", email = "sakodali@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
patternly = "patternly:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
