# Local services for development. Start with: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: patternly
      POSTGRES_PASSWORD: patternly  # local development only
      POSTGRES_DB: patternly
    ports:
      - "5433:5432"  # 5433 on the host, so it doesn't clash with another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patternly -d patternly"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
